name: Build and Push Custom Open WebUI Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: europe-west1
  REPO_NAME: open-webui
  IMAGE_NAME: open-webui-custom

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          export_environment_variables: true

      - name: Setup gcloud (with Artifact Registry auth)
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker to use gcloud for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set image tag
        id: vars
        run: |
          SHA_TAG="${GITHUB_SHA::12}"
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "full_repo=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Build and push
        run: |
          IMAGE="${{ steps.vars.outputs.full_repo }}"
          TAG_SHA="${IMAGE}:${{ steps.vars.outputs.sha_tag }}"
          TAG_LATEST="${IMAGE}:latest"
          docker build -t "${TAG_SHA}" -t "${TAG_LATEST}" .
          docker push "${TAG_SHA}"
          docker push "${TAG_LATEST}"

      - name: Output image refs
        run: |
          echo "Pushed:"
          echo "  ${{ steps.vars.outputs.full_repo }}:${{ steps.vars.outputs.sha_tag }}"
          echo "  ${{ steps.vars.outputs.full_repo }}:latest"


