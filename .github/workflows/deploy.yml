name: Deploy Open WebUI to GKE

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'helm/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

env:
  # Required secrets - only 2 secrets needed!
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  # Optional: OpenRouter API key for 344+ AI models (if not provided, models won't work)
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  # Default values (no secrets needed)
  GCP_REGION: europe-west1
  GCP_ZONE: europe-west1-b
  CLUSTER_NAME: open-webui-cluster
  NAMESPACE: ai
  BACKUP_BUCKET: open-webui-backups
  DOMAIN: ai-k8s.svdevops.tech

jobs:
  create-infrastructure:
    name: Create Infrastructure k8s in Google Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Diagnostics (gcloud context)
        run: |
          gcloud config list
          gcloud auth list
          gcloud projects describe ${{ env.GCP_PROJECT_ID }} --format='value(projectNumber,projectId)'
          echo "ADC file: ${{ steps.auth.outputs.credentials_file_path }}"
          echo "Env GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-<empty>}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Deploy Infrastructure
        run: |
          chmod +x ./scripts/deploy-infra.sh
          TF_VAR_project_id=${{ env.GCP_PROJECT_ID }} \
          TF_VAR_region=${{ env.GCP_REGION }} \
          TF_VAR_zone=${{ env.GCP_ZONE }} \
          TF_VAR_cluster_name=${{ env.CLUSTER_NAME }} \
          GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
          GCP_REGION=${{ env.GCP_REGION }} \
          GCP_ZONE=${{ env.GCP_ZONE }} \
          CLUSTER_NAME=${{ env.CLUSTER_NAME }} \
          ./scripts/deploy-infra.sh
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  deploy-app-to-kubernetes:
    name: Deploy app To Kubernetes
    runs-on: ubuntu-latest
    needs: create-infrastructure
    timeout-minutes: 30  # Increased timeout for NFS provisioner installation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

      - name: Get cluster credentials
        run: |
          export USE_GKE_GCLOUD_AUTH_PLUGIN=True
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --zone ${{ env.GCP_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}
          echo "Cluster credentials configured"
          kubectl cluster-info
          kubectl get nodes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy Application to Kubernetes
        run: |
          chmod +x ./scripts/deploy-to-k8s.sh
          echo "Starting deployment with environment variables:"
          echo "GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          echo "CLUSTER_NAME=${{ env.CLUSTER_NAME }}"
          echo "NAMESPACE=${{ env.NAMESPACE }}"
          echo "BACKUP_BUCKET=${{ env.BACKUP_BUCKET }}"
          echo "DOMAIN=${{ env.DOMAIN }}"
          echo "OPENROUTER_API_KEY is set: $([ -n \"${{ env.OPENROUTER_API_KEY }}\" ] && echo 'yes' || echo 'no')"
          echo "GCP_SA_KEY is set: $([ -n \"${{ env.GCP_SA_KEY }}\" ] && echo 'yes' || echo 'no')"
          
          TF_VAR_project_id=${{ env.GCP_PROJECT_ID }} \
          TF_VAR_region=${{ env.GCP_REGION }} \
          TF_VAR_zone=${{ env.GCP_ZONE }} \
          TF_VAR_cluster_name=${{ env.CLUSTER_NAME }} \
          GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
          GCP_REGION=${{ env.GCP_REGION }} \
          GCP_ZONE=${{ env.GCP_ZONE }} \
          CLUSTER_NAME=${{ env.CLUSTER_NAME }} \
          BACKUP_BUCKET=${{ env.BACKUP_BUCKET }} \
          DOMAIN=${{ env.DOMAIN }} \
          OPENROUTER_API_KEY=${{ env.OPENROUTER_API_KEY }} \
          GCP_SA_KEY=${{ env.GCP_SA_KEY }} \
          ./scripts/deploy-to-k8s.sh
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

      - name: Verify Deployment
        run: |
          export USE_GKE_GCLOUD_AUTH_PLUGIN=True
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --zone ${{ env.GCP_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}
          
          echo "=== Deployment completed! ==="
          echo ""
          echo "=== Checking namespace ==="
          kubectl get namespace ${{ env.NAMESPACE }} || echo "Namespace not found!"
          echo ""
          echo "=== Checking all resources in namespace ==="
          kubectl get all -n ${{ env.NAMESPACE }} || echo "No resources found"
          echo ""
          echo "=== Checking Helm releases ==="
          helm list -n ${{ env.NAMESPACE }} || echo "No Helm releases found"
          echo ""
          echo "=== Checking deployment ==="
          kubectl get deployment -n ${{ env.NAMESPACE }} || echo "No deployment found"
          echo ""
          echo "=== Checking pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=open-webui || echo "No pods found"
          echo ""
          REPLICAS=$(kubectl get deployment open-webui -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
          READY=$(kubectl get deployment open-webui -n ${{ env.NAMESPACE }} -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
          echo "Expected replicas: ${REPLICAS}"
          echo "Ready replicas: ${READY}"
          if [ "${READY}" != "${REPLICAS}" ]; then
            echo "Warning: Not all replicas are ready yet"
          fi
          echo ""
          echo "=== Ingress status ==="
          kubectl get ingress -n ${{ env.NAMESPACE }} || echo "No ingress found"
          echo ""
          echo "Application URL: https://${{ env.DOMAIN }}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
      
      - name: Diagnose pods if not Ready
        if: failure()
        run: |
          export USE_GKE_GCLOUD_AUTH_PLUGIN=True
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --zone ${{ env.GCP_ZONE }} \
            --project ${{ env.GCP_PROJECT_ID }}
          
          NS=${{ env.NAMESPACE }}
          echo "=== Diagnosing deployment failure in namespace ${NS} ==="
          echo ""
          
          echo "=== Checking if namespace exists ==="
          kubectl get namespace "${NS}" || echo "Namespace ${NS} does not exist!"
          echo ""
          
          echo "=== Checking all resources ==="
          kubectl get all -n "${NS}" || echo "No resources found"
          echo ""
          
          echo "=== Checking Helm releases ==="
          helm list -n "${NS}" || echo "No Helm releases found"
          if helm list -n "${NS}" | grep -q open-webui; then
            echo "Helm release exists, checking status:"
            helm status open-webui -n "${NS}" || true
          fi
          echo ""
          
          echo "=== Checking deployment ==="
          kubectl get deployment open-webui -n "${NS}" || echo "Deployment open-webui not found!"
          if kubectl get deployment open-webui -n "${NS}" >/dev/null 2>&1; then
            kubectl describe deployment open-webui -n "${NS}" || true
          fi
          echo ""
          
          REPLICAS=$(kubectl get deployment open-webui -n "${NS}" -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
          READY=$(kubectl get deployment open-webui -n "${NS}" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
          echo "Expected replicas: ${REPLICAS}, Ready replicas: ${READY}"
          
          if [ "${READY}" = "${REPLICAS}" ] && [ "${REPLICAS}" != "0" ]; then
            echo "All ${REPLICAS} replicas are ready!"
            exit 0
          fi
          
          echo "=== Checking pods ==="
          kubectl get pods -n "${NS}" -l app.kubernetes.io/name=open-webui || echo "No pods found"
          echo ""
          
          # Check each pod
          for POD in $(kubectl get pods -n "${NS}" -l app.kubernetes.io/name=open-webui -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            if [ -n "${POD}" ]; then
              echo "---- Pod ${POD} details ----"
              kubectl describe pod "${POD}" -n "${NS}" || true
              echo ""
              echo "---- Pod ${POD} logs ----"
              kubectl logs "${POD}" -n "${NS}" --tail=50 || true
              echo ""
            fi
          done
          
          echo "=== Checking all pods in namespace ==="
          kubectl get pods -n "${NS}" || echo "No pods found"
          echo ""
          
          echo "=== Recent events ==="
          kubectl get events -n "${NS}" --sort-by=.lastTimestamp | tail -n 50 || echo "No events found"
          echo ""
          
          echo "=== Checking PVC ==="
          kubectl get pvc -n "${NS}" || echo "No PVCs found"
          echo ""
          
          echo "=== Checking secrets ==="
          kubectl get secrets -n "${NS}" || echo "No secrets found"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
